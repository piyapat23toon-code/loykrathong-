<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ลอยกระทงออนไลน์ 🪷 คืนวันเพ็ญเดือนสิบสอง</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E" />

  <!-- Open Graph / LINE / Facebook / Instagram Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ลอยกระทงออนไลน์" />
  <meta property="og:url" content="https://piyapat23toon-code.github.io/loykrathong-/" />
  <meta property="og:title" content="ชวนมาลอยกระทงออนไลน์ด้วยกัน" />
  <meta property="og:description" content="คืนวันเพ็ญเดือนสิบสอง มาแต่งตัว แต่งกระทง และอธิษฐานไปด้วยกันนะ 🌕✨" />
  <meta property="og:image" content="https://piyapat23toon-code.github.io/loykrathong-/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="💌 ชวนมาลอยกระทงออนไลน์ด้วยกัน 🪷" />
  <meta name="twitter:description" content="คืนวันเพ็ญเดือนสิบสอง มาแต่งตัว แต่งกระทง และอธิษฐานไปด้วยกันนะ 🌕✨" />
  <meta name="twitter:image" content="https://piyapat23toon-code.github.io/loykrathong-/og-image.png" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050a1f;
      color: #fde9b8;
      font-family: -apple-system, BlinkMacSystemFont, "Prompt", sans-serif;
    }
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
      z-index: 1;
    }
    .loader-icon {
      font-size: 48px;
      animation: float 2.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .loader p {
      font-size: 15px;
      opacity: 0.9;
    }
    .fallback-btn {
      margin-top: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fde3a0, #f4c76b 45%, #f48fab);
      color: #2a1530;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(244, 143, 171, 0.35);
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-icon">🪷</div>
    <p>กำลังเปิดหน้าลอยกระทงออนไลน์…</p>
    <a id="directLink" class="fallback-btn" href="#">แตะที่นี่หากหน้าจอไม่โหลด ✨</a>
  </div>

  <iframe
    id="appFrame"
    allow="clipboard-write; web-share"
    allowfullscreen
  ></iframe>

  <script>
    // วางลิงก์ Web App URL ล่าสุดที่ลงท้ายด้วย /exec จาก GAS ตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwSlH2slWD2GoSZzmc-iNei3XUeOaFAms9kLeVxYLuTYEzn5D7-sgEEtH0NLxpeRd13HQ/exec";

    const targetUrl = GAS_URL + window.location.search;
    document.getElementById("directLink").href = targetUrl;

    // ตรวจจับ In-App Browser (Instagram, Facebook, LINE, TikTok) ซึ่งบล็อก GAS ใน iframe บน iOS
    const ua = navigator.userAgent || "";
    const isInAppBrowser = /Instagram|FBAN|FBAV|Line|BytedanceWebview|TikTok/i.test(ua);

    if (isInAppBrowser) {
      window.location.replace(targetUrl);
    } else {
      const frame = document.getElementById("appFrame");
      frame.src = targetUrl;
      frame.onload = () => {
        document.getElementById("loader").style.display = "none";
      };
    }
  </script>
</body>
</html>
