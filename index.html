<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ลอยกระทงออนไลน์ 🪷 คืนวันเพ็ญเดือนสิบสอง</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E" />

  <!-- Open Graph / LINE / Facebook / Instagram Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ลอยกระทงออนไลน์" />
  <meta property="og:url" content="https://piyapat23toon-code.github.io/loykrathong-/" />
  <meta property="og:title" content="💌 ชวนมาลอยกระทงออนไลน์ด้วยกัน 🪷" />
  <meta property="og:description" content="คืนวันเพ็ญเดือนสิบสอง มาแต่งตัว แต่งกระทง และอธิษฐานไปด้วยกันนะ 🌕✨" />
  <meta property="og:image" content="https://piyapat23toon-code.github.io/loykrathong-/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="💌 ชวนมาลอยกระทงออนไลน์ด้วยกัน 🪷" />
  <meta name="twitter:description" content="คืนวันเพ็ญเดือนสิบสอง มาแต่งตัว แต่งกระทง และอธิษฐานไปด้วยกันนะ 🌕✨" />
  <meta name="twitter:image" content="https://piyapat23toon-code.github.io/loykrathong-/og-image.png" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #142254, #050a1f 75%);
      color: #fde9b8;
      font-family: -apple-system, BlinkMacSystemFont, "Prompt", sans-serif;
    }
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    .loader-icon {
      font-size: 56px;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .loader h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    .loader p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.72);
      max-width: 280px;
      line-height: 1.5;
    }
    .open-btn {
      margin-top: 6px;
      padding: 12px 26px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fde3a0, #f4c76b 45%, #f48fab);
      color: #2a1530;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(244, 143, 171, 0.4);
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-icon">🪷</div>
    <h1>กำลังเปิดหน้าลอยกระทงออนไลน์</h1>
    <p>หากหน้าเว็บไม่เปิดอัตโนมัติ ให้กดปุ่มด้านล่างเพื่อเข้าสู่หน้าลอยกระทงได้เลย</p>
    <a id="directLink" class="open-btn" href="#">เข้าสู่หน้าลอยกระทง ✨</a>
  </div>

  <iframe
    id="appFrame"
    allow="clipboard-write; web-share"
    allowfullscreen
  ></iframe>

  <script>
    // วางลิงก์ Web App URL ล่าสุดที่ลงท้ายด้วย /exec จาก GAS ตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwSlH2slWD2GoSZzmc-iNei3XUeOaFAms9kLeVxYLuTYEzn5D7-sgEEtH0NLxpeRd13HQ/exec";

    const targetUrl = GAS_URL + window.location.search;
    document.getElementById("directLink").href = targetUrl;

    const ua = navigator.userAgent || "";
    const ref = document.referrer || "";

    // ตรวจจับทั้ง User-Agent และ Referrer ของ Instagram / Facebook / LINE / TikTok
    const isInApp =
      /Instagram|FBAN|FBAV|Line|BytedanceWebview|TikTok/i.test(ua) ||
      /instagram\.com|facebook\.com|line\.me|tiktok\.com/i.test(ref);

    if (isInApp) {
      window.location.href = targetUrl;
    } else {
      const frame = document.getElementById("appFrame");
      let loaded = false;

      frame.onload = () => {
        loaded = true;
        frame.style.display = "block";
        document.getElementById("loader").style.display = "none";
      };

      frame.src = targetUrl;

      // หากเปิดบนมือถือ/เบราว์เซอร์ที่บล็อก iframe ให้เด้งไปหน้า GAS โดยตรงหลัง 2 วินาที
      setTimeout(() => {
        if (!loaded) {
          window.location.href = targetUrl;
        }
      }, 2000);
    }
  </script>
</body>
</html>
